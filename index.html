<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LEX BUSCADOR</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    .box {
      background: #151515;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #333;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
    }

    input,
    select,
    button {
      width: 100%;
      height: 50px;
      box-sizing: border-box;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    input,
    select {
      background: #0b0b0b;
      color: white;
      border: 1px solid #444;
      padding: 10px;
    }

    button {
      background: white;
      color: black;
      border: none;
      font-weight: bold;
    }

    #resultado {
      margin-top: 20px;
    }

    .resultado-box {
      background: #151515;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 20px;
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>LEX BUSCADOR</h1>

    <div class="subtitle">
      Buscador inteligente de materiais para tatuagem
    </div>

    <div class="box">

      <label for="busca">
        O que você está procurando?
      </label>

      <input
        id="busca"
        type="text"
        placeholder="Ex.: 9RL 0.35 Standard"
      >

      <label for="loja">
        Loja
      </label>

      <select id="loja">
        <option>Electric Ink</option>
        <option>Todas as lojas</option>
      </select>

      <button onclick="procurar()">
        🔎 PROCURAR
      </button>

    </div>

    <div id="resultado">

      <div class="resultado-box">
        Digite o que você procura e toque em PROCURAR.
      </div>

    </div>

    <footer>
      LEX Buscador — projeto em desenvolvimento
    </footer>

  </div>

  <script>

    function procurar() {

      const busca = document.getElementById("busca").value;

      const resultado = document.getElementById("resultado");

      if (busca.trim() === "") {

        resultado.innerHTML = `
          <div class="resultado-box">
            Digite alguma coisa para pesquisar.
          </div>
        `;

        return;
      }

      resultado.innerHTML = `
        <div class="resultado-box">

          <strong>Busca recebida:</strong>

          <br><br>

          ${busca}

          <br><br>

          O LEX Buscador recebeu sua pesquisa.
          <br>
          O mecanismo de busca será conectado na próxima etapa.

        </div>
      `;

    }

  </script>

</body>
</html>
