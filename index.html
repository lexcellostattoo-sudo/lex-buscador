<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LEX Buscador</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .logo {
      text-align: center;
      margin-bottom: 8px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .subtitle {
      text-align: center;
      color: #aaaaaa;
      margin-bottom: 35px;
    }

    .search-box {
      background: #1c1c1c;
      border: 1px solid #333333;
      border-radius: 16px;
      padding: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #444444;
      background: #101010;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .results {
      margin-top: 30px;
    }

    .results-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .result-card {
      background: #1c1c1c;
      border: 1px solid #333333;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .result-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      color: #bbbbbb;
      font-size: 14px;
      line-height: 1.7;
    }

    .tag {
      display: inline-block;
      background: #303030;
      border-radius: 6px;
      padding: 4px 8px;
      margin: 3px 3px 3px 0;
      font-size: 12px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-top: 12px;
    }

    .open-link {
      display: inline-block;
      margin-top: 12px;
      color: white;
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      color: #888888;
      padding: 30px 10px;
    }

    .footer {
      text-align: center;
      color: #666666;
      font-size: 12px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      LEX BUSCADOR
    </div>

    <div class="subtitle">
      Buscador inteligente de materiais para tatuagem
    </div>

    <section class="search-box">

      <label for="search">
        O que você está procurando?
      </label>

      <input
        id="search"
        type="text"
        placeholder="Ex.: 9RL 0.35 Standard"
      >

      <label for="store">
        Loja
      </label>

      <select id="store">
        <option value="electricink">
          Electric Ink
        </option>

        <option value="all">
          Todas as lojas
        </option>
      </select>

      <button onclick="searchProducts()">
        🔎 PROCURAR
      </button>

    </section>

    <section class="results">

      <div class="results-title">
        Resultados
      </div>

      <div id="results">

        <div class="empty">
          Digite o que você procura e toque em PROCURAR.
        </div>

      </div>

    </section>

    <div class="footer">
      LEX Buscador — projeto em desenvolvimento
    </div>

  </main>

  <script>

    function searchProducts() {

      const search = document
        .getElementById("search")
        .value
        .trim();

      const results = document
        .getElementById("results");

      if (!search) {

        results.innerHTML = `
          <div class="empty">
            Digite alguma coisa para pesquisar.
          </div>
        `;

        return;
      }

      results.innerHTML = `
        <div class="result-card">

          <div class="result-name">
            🔎 Pesquisa recebida
          </div>

          <div class="info">

            Você pesquisou:

            <br><br>

            <span class="tag">
              ${search}
            </span>

            <br><br>

            O motor de busca da Electric Ink
            será conectado nesta próxima etapa.

          </div>

        </div>
      `;

    }

  </script>

</body>
</html>
