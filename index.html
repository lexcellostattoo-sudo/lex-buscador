<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LEX BUSCADOR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      letter-spacing: 2px;
      margin: 10px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    .box {
      background: #151515;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #bbb;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 50px;
      border-radius: 10px;
      font-size: 16px;
    }

    input,
    select {
      background: #0b0b0b;
      color: white;
      border: 1px solid #444;
      padding: 12px;
      margin-bottom: 18px;
    }

    button {
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .result-card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 20px;
      margin-top: 15px;
    }

    .result-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .tag {
      display: inline-block;
      background: #292929;
      color: #ddd;
      padding: 7px 10px;
      border-radius: 20px;
      margin: 3px;
      font-size: 13px;
    }

    .info {
      color: #aaa;
      line-height: 1.6;
    }

    .success {
      color: #fff;
    }

    .warning {
      color: #ffcc66;
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>LEX BUSCADOR</h1>

  <div class="subtitle">
    Buscador inteligente de materiais para tatuagem
  </div>

  <div class="box">

    <label for="busca">
      O que você está procurando?
    </label>

    <input
      id="busca"
      type="text"
      placeholder="Ex.: 9RL 0.35 Standard"
      autocomplete="off"
    >

    <label for="loja">
      Loja
    </label>

    <select id="loja">
      <option value="electricink">Electric Ink</option>
      <option value="todas">Todas as lojas</option>
    </select>

    <button onclick="procurar()">
      🔎 PROCURAR
    </button>

  </div>

  <div id="resultado">

    <div class="result-card">

      <div class="info">
        Digite uma configuração de cartucho para começar.
      </div>

    </div>

  </div>

  <footer>
    LEX Buscador — projeto em desenvolvimento
  </footer>

</div>


<script>

/*
==========================================================
LEX BUSCADOR
MOTOR DE INTERPRETAÇÃO
==========================================================
*/


/*
----------------------------------------------------------
NORMALIZA TEXTO
----------------------------------------------------------
*/

function normalizar(texto) {

  return texto
    .toLowerCase()
    .replace(/,/g, ".")
    .replace(/\s+/g, " ")
    .trim();

}


/*
----------------------------------------------------------
DETECTAR DIÂMETRO
----------------------------------------------------------
*/

function detectarDiametro(texto) {

  const t = normalizar(texto);

  if (
    t.includes("0.20") ||
    t.includes("0.20mm") ||
    t.includes("#06")
  ) {
    return "0.20 mm";
  }

  if (
    t.includes("0.25") ||
    t.includes("0.25mm") ||
    t.includes("#08")
  ) {
    return "0.25 mm";
  }

  if (
    t.includes("0.30") ||
    t.includes("0.30mm") ||
    t.includes("#10")
  ) {
    return "0.30 mm";
  }

  if (
    t.includes("0.35") ||
    t.includes("0.35mm") ||
    t.includes("#12")
  ) {
    return "0.35 mm";
  }

  return null;

}


/*
----------------------------------------------------------
DETECTAR CONFIGURAÇÃO
----------------------------------------------------------
*/

function detectarConfiguracao(texto) {

  const t = normalizar(texto);

  let resultado;


  /*
  CÓDIGOS COMPLETOS

  Exemplo:

  1209RL
  1009RL
  0809RL
  0609RL
  */

  resultado = t.match(/\b(06|08|10|12)0?(\d{1,2})rl\b/);

  if (resultado) {

    const numero = parseInt(resultado[2]);

    return numero.toString().padStart(2, "0") + "RL";

  }


  /*
  9RL
  09RL
  */

  resultado = t.match(/\b0?(\d{1,2})\s*rl\b/);

  if (resultado) {

    const numero = parseInt(resultado[1]);

    return numero.toString().padStart(2, "0") + "RL";

  }


  /*
  RL9
  RL09
  */

  resultado = t.match(/\brl\s*0?(\d{1,2})\b/);

  if (resultado) {

    const numero = parseInt(resultado[1]);

    return numero.toString().padStart(2, "0") + "RL";

  }


  /*
  9 ROUND LINER
  */

  resultado = t.match(/\b0?(\d{1,2})\s+round\s+liner\b/);

  if (resultado) {

    const numero = parseInt(resultado[1]);

    return numero.toString().padStart(2, "0") + "RL";

  }


  /*
  ROUND LINER 9
  */

  resultado = t.match(/\bround\s+liner\s+0?(\d{1,2})\b/);

  if (resultado) {

    const numero = parseInt(resultado[1]);

    return numero.toString().padStart(2, "0") + "RL";

  }


  return null;

}


/*
----------------------------------------------------------
DETECTAR TAPER
----------------------------------------------------------
*/

function detectarTaper(texto) {

  const t = normalizar(texto);


  if (
    t.includes("super long") ||
    t.includes("superlong") ||
    t.includes("slt")
  ) {

    return "Super Long Taper";

  }


  if (
    t.includes("extra long") ||
    t.includes("extralong")
  ) {

    return "Extra Long Taper";

  }


  if (
    t.includes("long taper")
  ) {

    return "Long Taper";

  }


  if (
    t.includes("standard taper") ||
    t.includes("standard") ||
    t.includes("std")
  ) {

    return "Standard Taper";

  }


  return null;

}


/*
----------------------------------------------------------
DETECTAR DIÂMETRO ATRAVÉS DO CÓDIGO
----------------------------------------------------------
*/

function detectarCodigoDiametro(texto) {

  const t = normalizar(texto);

  const codigo =
    t.match(/\b(06|08|10|12)0?\d{1,2}rl\b/);

  if (!codigo) {
    return null;
  }

  const mapa = {

    "06": "0.20 mm",

    "08": "0.25 mm",

    "10": "0.30 mm",

    "12": "0.35 mm"

  };

  return mapa[codigo[1]] || null;

}


/*
----------------------------------------------------------
INTERPRETAR BUSCA
----------------------------------------------------------
*/

function interpretarBusca(texto) {

  const configuracao =
    detectarConfiguracao(texto);

  let diametro =
    detectarDiametro(texto);

  const taper =
    detectarTaper(texto);

  const diametroCodigo =
    detectarCodigoDiametro(texto);


  /*
  Se o código trouxer o diâmetro,
  ele tem prioridade.
  */

  if (diametroCodigo) {

    diametro = diametroCodigo;

  }


  return {

    configuracao: configuracao,

    diametro: diametro,

    taper: taper

  };

}


/*
----------------------------------------------------------
MOSTRAR RESULTADO
----------------------------------------------------------
*/

/* =========================================
   BASE DE PRODUTOS — ELECTRIC INK
   ========================================= */

const produtosElectricInk = [
  {
    nome: "Cartridge Pro Universal Round Liner 09",
    codigo: "09RL",
    diametro: "0.30 mm",
    taper: "Super Long Taper",
    marca: "Electric Ink",
    loja: "Electric Ink",
    preco: 9.80,
    moeda: "BRL",
    url: "https://www.electricink.com.br/09rl-cartridgeprouniversalroundliner09--0-30/p"
  }
];

function procurar() {

  const campo =
    document.getElementById("busca");

  const texto =
    campo.value.trim();

  const resultado =
    document.getElementById("resultado");


  if (!texto) {

    resultado.innerHTML = `

      <div class="result-card">

        <div class="warning">
          Digite alguma coisa para pesquisar.
        </div>

      </div>

    `;

    return;

  }


  const busca =
    interpretarBusca(texto);


  resultado.innerHTML = `

    <div class="result-card">

      <div class="result-title">
        🔎 Busca interpretada
      </div>

      <div class="info">

        <span class="tag">
          Busca: ${texto}
        </span>

        ${
          busca.configuracao
          ? `
            <span class="tag">
              Configuração: ${busca.configuracao}
            </span>
          `
          : `
            <span class="tag">
              Configuração: não identificada
            </span>
          `
        }

        ${
          busca.diametro
          ? `
            <span class="tag">
              Diâmetro: ${busca.diametro}
            </span>
          `
          : `
            <span class="tag">
              Diâmetro: não especificado
            </span>
          `
        }

        ${
          busca.taper
          ? `
            <span class="tag">
              Taper: ${busca.taper}
            </span>
          `
          : `
            <span class="tag">
              Taper: não especificado
            </span>
          `
        }

      </div>

      <br>

      <div class="info">

        <strong>Próxima etapa:</strong>

        <br><br>

        O LEX já conseguiu interpretar sua pesquisa.
        Agora vamos conectar essa interpretação aos
        produtos reais das lojas.

      </div>

    </div>

  `;

}


/*
----------------------------------------------------------
ENTER PARA PESQUISAR
----------------------------------------------------------
*/

document
  .getElementById("busca")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      procurar();

    }

  });

</script>

</body>
</html>
